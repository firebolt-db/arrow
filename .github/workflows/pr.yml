---
name: "Lint PR"
on:
  pull_request:
    branches:
      - main
      - release-*
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  pr_conventions:
    uses: firebolt-analytics/gha-workflows/.github/workflows/conventional_pr.yaml@6ccfd546d5ea43c10c12d27b8d7531ac42498d6a  # v2.25.0
    with:
      validate-branch-name: false
      validate-single-commit: false
