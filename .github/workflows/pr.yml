---
name: "Lint PR"
on:
  pull_request:
    branches:
      - main
      - release/**
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  pr_conventions:
    uses: firebolt-analytics/gha-workflows/.github/workflows/conventional_pr.yaml@d6346f1e202c7164f5c7851a220d46112cd4ae8a  # v2.6.2
    with:
      validate-branch-name: false
      validate-single-commit: false
